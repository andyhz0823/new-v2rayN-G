name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge fixture and .NET compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply v2rayN-G Xboard integration overlay
        shell: pwsh
        run: ./scripts/apply-xboard-overlays.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile the Xboard bridge
        run: dotnet build desktop/v2rayn-g.Desktop.csproj --configuration Release --nologo
      - name: Verify internal and external profile parsing
        run: >-
          dotnet run --project desktop/v2rayn-g.Desktop.csproj --configuration Release --
          --fixture desktop/fixtures/get-subscribe.json --panel-url https://panel.example.com
      - name: Reject accidental credential commits
        shell: bash
        run: |
          if git grep -nEI 'token=[A-Za-z0-9]{20,}' -- ':!desktop/fixtures/*' ':!README.md' ':!shared/*'; then
            echo "Potential credential-like token found in tracked source"
            exit 1
          fi

