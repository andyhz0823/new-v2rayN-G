name: Build and release v2rayN-G

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish v2rayN
        shell: pwsh
        run: >-
          dotnet publish
          v2rayN/v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/windows-x64
          --nologo

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive -Path artifacts/windows-x64/* -DestinationPath artifacts/release/v2rayN-G-windows-x64.zip -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayN-G-windows-x64
          path: artifacts/release/v2rayN-G-windows-x64.zip
          if-no-files-found: error

      - name: Sign Windows artifact with GitHub keyless attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/v2rayN-G-windows-x64.zip

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            runtime: osx-x64
          - arch: arm64
            runner: macos-14
            runtime: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish v2rayN
        run: >-
          dotnet publish
          v2rayN/v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --output artifacts/macos-${{ matrix.arch }}
          --nologo

      - name: Create macOS DMG
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          RUNTIME: ${{ matrix.runtime }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          app_root="$RUNNER_TEMP/v2rayN-G.app"
          rm -rf "$app_root"
          mkdir -p "$app_root/Contents/MacOS" "$app_root/Contents/Resources"
          cp -R artifacts/macos-${ARCH}/. "$app_root/Contents/MacOS/"
          cp v2rayN/v2rayN/v2rayN.Desktop/v2rayN.icns "$app_root/Contents/Resources/AppIcon.icns"
          chmod +x "$app_root/Contents/MacOS/v2rayN"
          cat > "$app_root/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>v2rayN-G</string>
            <key>CFBundleExecutable</key><string>v2rayN</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIdentifier</key><string>com.andyhz0823.v2rayn-g</string>
            <key>CFBundleName</key><string>v2rayN-G</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${RELEASE_TAG#v}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          mkdir -p artifacts/release
          hdiutil create -volname "v2rayN-G macOS ${ARCH}" -srcfolder "$app_root" -ov -format UDZO "artifacts/release/v2rayN-G-macos-${ARCH}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayN-G-macos-${{ matrix.arch }}
          path: artifacts/release/v2rayN-G-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Sign macOS artifact with GitHub keyless attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/v2rayN-G-macos-${{ matrix.arch }}.dmg

  android:
    name: Android universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 29
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager exits after reading all licenses; yes may receive SIGPIPE,
          # so do not let that harmless producer exit fail the step under pipefail.
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 "ndk;29.0.14206865"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          (( sdkmanager_status == 0 )) || exit "$sdkmanager_status"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sed -i '10i\    ndkVersion = "29.0.14206865"' v2rayNG/V2rayNG/app/build.gradle.kts

      - name: Build hev-socks5-tunnel native library
        working-directory: v2rayNG
        shell: bash
        run: |
          set -euo pipefail
          bash compile-hevtun.sh
          cp -R libs V2rayNG/app/

      - name: Fetch AndroidLibXrayLite release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git -C v2rayNG/AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "ANDROID_LIB_XRAY_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download libv2ray AAR
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.ANDROID_LIB_XRAY_TAG }}
          fileName: libv2ray.aar
          out-file-path: v2rayNG/V2rayNG/app/libs

      - name: Build Play Store release APK
        working-directory: v2rayNG/V2rayNG
        run: ./gradlew --no-daemon --stacktrace assemblePlaystoreRelease

      - name: Sign APK with the release keystore stored in GitHub Actions
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo 'Missing Android signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in the repository.' >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p artifacts/release
          shopt -s nullglob
          apks=(v2rayNG/V2rayNG/app/build/outputs/apk/playstore/release/*.apk)
          (( ${#apks[@]} )) || { echo 'No Play Store release APK found'; exit 1; }
          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            "$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "artifacts/release/v2rayNG-G-$name" "$apk"
          done
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in artifacts/release/*.apk; do
            "$signer" verify --verbose "$apk"
          done

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-G-android
          path: artifacts/release/*.apk
          if-no-files-found: error

      - name: Sign Android artifact with GitHub keyless attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/*.apk

  release:
    name: Create GitHub Release and detached signatures
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/downloaded
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          find artifacts/downloaded -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.apk' \) -exec cp {} artifacts/release/ \;
          shopt -s nullglob
          files=(artifacts/release/*.zip artifacts/release/*.dmg artifacts/release/*.apk)
          (( ${#files[@]} )) || { echo 'No release files found'; exit 1; }
          (cd artifacts/release && sha256sum *.zip *.dmg *.apk > SHA256SUMS.txt)

      - name: Create GitHub keyless artifact attestations for the checksum manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/release/SHA256SUMS.txt

      - name: Install Cosign for keyless release signing
        uses: sigstore/cosign-installer@v4.1.2

      - name: Create Sigstore keyless signatures for release files
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/release
          for file in *.zip *.dmg *.apk SHA256SUMS.txt; do
            [[ -f "$file" ]] || continue
            # GitHub Actions OIDC + Sigstore Fulcio/Rekor; no private signing key is stored locally.
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Create GPG signatures when a repository signing key is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo 'GPG_PRIVATE_KEY is not configured; GitHub keyless attestations will remain the authoritative release signature.'
            exit 0
          fi
          install -m 700 -d ~/.gnupg
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd artifacts/release
          for file in *.zip *.dmg *.apk SHA256SUMS.txt; do
            [[ -f "$file" ]] || continue
            gpg --batch --yes --armor --detach-sign --output "$file.asc" "$file"
          done
          gpg --batch --armor --export > v2rayN-G-public-key.asc

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            tag='${{ inputs.tag }}'
            prerelease='${{ inputs.prerelease }}'
          else
            tag="$GITHUB_REF_NAME"
            prerelease='false'
          fi
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/release/*.zip
            artifacts/release/*.dmg
            artifacts/release/*.apk
            artifacts/release/SHA256SUMS.txt
            artifacts/release/*.sigstore.json

      - name: Upload optional GPG signatures and public key
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find artifacts/release -maxdepth 1 -type f \( -name '*.asc' -o -name '*public-key.asc' \) -print0)
          if (( ${#files[@]} )); then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            echo 'No optional GPG signatures were generated.'
          fi
