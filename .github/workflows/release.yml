name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows v2rayN
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        working-directory: v2rayN/v2rayN
        run: dotnet restore v2rayN.sln --nologo
      - name: Publish desktop build
        working-directory: v2rayN/v2rayN
        run: >-
          dotnet publish v2rayN.Desktop/v2rayN.Desktop.csproj --configuration Release
          --runtime win-x64 --self-contained false --output ../../artifacts/windows/v2rayN-G-win-x64
      - name: Archive Windows artifact
        shell: pwsh
        run: >-
          Compress-Archive -Path artifacts/windows/v2rayN-G-win-x64/*
          -DestinationPath artifacts/windows/v2rayN-G-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: v2rayN-G-win-x64
          path: artifacts/windows/v2rayN-G-win-x64.zip
          if-no-files-found: error

  android:
    name: Build Android v2rayNG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build unsigned release APK
        working-directory: v2rayNG/V2rayNG
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-G-unsigned-apk
          path: v2rayNG/V2rayNG/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    name: Create GitHub release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Determine tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then tag="${{ inputs.tag }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/v2rayN-G-win-x64/v2rayN-G-win-x64.zip
            artifacts/v2rayNG-G-unsigned-apk/*.apk
